function starsSVG(n) {
  const st = (on, k) => `<svg class="star${on ? ' on' : ''}" style="animation-delay:${.15 + k * .15}s" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`;
  return `<div class="stars" role="img" aria-label="${tr(`${n} de 3 estrellas`, `${n} of 3 stars`)}">${[0, 1, 2].map((k) => st(k < n, k)).join('')}</div>`;
}
function showWin() {
  sfx('victoria', .8);
  const last = li + 1 >= NIVELES.length;
  const fails = (L.moves - moves) - REP.minMoves; // toques que chocaron
  const stars = fails <= 0 ? 3 : fails <= 2 ? 2 : 1;
  lvEnd('win', { stars });
  const tutoEnd = L.id === TUTO_N, tierEnd = li === TIERS[tierOf(li)].to;
  const line = tx(ROOMS[li][2]), space = tx(ROOMS[li][0]), nextT = TIERS[tierOf(li) + 1] && tx(TIERS[tierOf(li) + 1].name);
  card(`${scene(li, 'new')}${starsSVG(stars)}<div class="left" aria-label="${tr(`Te sobran ${moves} movimientos`, `${moves} moves to spare`)}">${$('moves').querySelector('svg').outerHTML}<b>+${moves}</b></div>${words() ? (tutoEnd ? `<h2>${line}</h2><p>${tr('<b>Tutorial completado.</b> Ya sabes lo básico: desde aquí juegas sin ayudas y solo te aviso cuando aparezca algo nuevo.', '<b>Tutorial complete.</b> You know the basics: from here you play without help, and I’ll only tell you when something new shows up.')}</p>`
    : tierEnd ? `<h2>${tr(`¡Nivel ${tierOf(li) + 1} completado!`, `Level ${tierOf(li) + 1} complete!`)}</h2><p>${line} ${tr(`${space} ha recuperado todo su color.`, `${space} has all its color back.`)}${last ? tx(' Fin del prototipo.') : tr(` Siguiente: <b>${nextT}</b>.`, ` Next: <b>${nextT}</b>.`)}</p>`
    : `<h2>${line}</h2><p>${last ? tx('Has devuelto el color a todo el edificio. Fin del prototipo.') : fails <= 0 ? tx('Sin un solo choque.') : tr(`${fails} ${fails === 1 ? 'choque' : 'choques'}: sin chocar, 3 estrellas.`, `${fails} ${fails === 1 ? 'bump' : 'bumps'}: no bumps, 3 stars.`)}</p>`) : ''}
    <div class="row">${last ? `<button class="btn" id="b1" aria-label="${tx('Jugar otra vez')}">${ICON.retry}</button>`
      : `<button class="btn primary big" id="b1" aria-label="${tx('Siguiente nivel')}">${ICON.next}${words() ? tx('Siguiente') : ''}</button>`}</div>`);
  const next = () => load(last ? 0 : li + 1);
  $('b1').onclick = li === TIERS[1].to || last ? () => survey(next) : next; // tras los portales (ya ha visto lo que lo hace distinto), 2 preguntas
  $('sr').textContent = tx('Nivel superado. ') + line;
  setTimeout(() => $('card').querySelector('.el.new')?.classList.add('lit'), reduced ? 0 : 450); // la pintura llega a la sala
  celebrate();

// Celebración: salpicadura de pintura de todos los colores desde el centro del tablero.
function celebrate() {
  if (reduced) return;
  const cx = vw() / 2, cy = vh() / 2;
  ['red', 'blue', 'yellow', 'green'].forEach((c, j) => setTimeout(() => {
    for (let k = 0; k < 4; k++) particles(cx, cy, Math.cos(k * Math.PI / 2 + j), Math.sin(k * Math.PI / 2 + j), c);
  }, j * 90));
}

function showOut() {
  sfx('fin', .7);
  if (endless) return gameOver();
  lvEnd('out');
  card(`${words() ? `<h2>${tx('Sin movimientos')}</h2>` : ''}<div class="row"><button class="btn" id="b1" aria-label="${tx('Reintentar nivel')}">${ICON.retry}${words() ? tx('Reintentar') : ''}</button></div>`);
  $('b1').onclick = () => load(li);
}
function showDead() {
  sfx('fin', .6);
  $('rewindBtn').classList.add('pulse');
  lvEnd('dead');
  // en niveles de orden (portal blanco o puerta con secuencia), el porqué: es la regla que más cuesta (telemetría, 3-2)
  const order = L.layers.some((l) => l.doors.some((d) => d.colors.length > 1 || d.colors[0] === WHITE));
  card(`${words() ? `<h2>${tx('Así ya no sale')}</h2><p>${tx('Con lo que ha caído, la capa de abajo no se puede vaciar.')}</p>${order ? `<p>${tr('<b>El orden importa:</b> lo que entra por un portal blanco llega abajo en ese mismo orden, y las puertas de abajo piden sus colores en el suyo. Rebobina y mira antes la capa de abajo.', '<b>Order matters:</b> what goes through a white portal arrives below in that same order, and the doors below ask for their colors in theirs. Rewind and look at the layer below first.')}</p>` : ''}` : ''}
    <div class="row"><button class="btn primary" id="b1" aria-label="${tx('Rebobinar capa')}">${ICON.rewind}${words() ? tx('Rebobinar capa') : ''}</button>
    <button class="btn" id="b2" aria-label="${tx('Ver la capa de abajo')}">${words() ? tx('Ver la capa de abajo') : '👁'}</button></div>`);
  $('b1').onclick = rewind;
  $('b2').onclick = () => { closeOv(); if (board.layer + 1 < L.layers.length) setView(board.layer + 1); };

function rewind() {
  board = start.board; moves = start.moves; exits = start.exits ?? exits; view = board.layer;
  $('rewindBtn').classList.remove('pulse');

}

function menu() {
  card(`<h2>${tx('Niveles')}</h2>${TIERS.map((T, t) => `<section class="tier"><h3>${tr('Nivel', 'Level')} ${t + 1} · ${tx(T.name)}</h3><p>${tx(T.what)}</p><div class="grid10">${
    NIVELES.slice(T.from, T.to + 1).map((n, k) => { const i = T.from + k; return `<button class="btn${n.level.layers.length > 1 ? ' two' : ''}${i === li ? ' cur' : ''}" data-l="${i}" aria-label="${tr(`Nivel ${t + 1}, prueba ${k + 1}`, `Level ${t + 1}, stage ${k + 1}`)}">${k + 1}</button>`; }).join('')}</div></section>`).join('')}
    <div class="row"><button class="btn" id="goHome">${ICON.home} ${tx('Inicio')}</button><button class="btn ghostbtn" id="reTuto">${tx('Repetir tutorial')}</button></div>`);
  $('card').querySelectorAll('[data-l]').forEach((b) => (b.onclick = () => load(+b.dataset.l)));

// Una flecha que ahora mismo puede salir y cuyo recorrido pasa por un girador (para el tutorial).
function turningArrow() {
  const tc = new Set((board.lay.turners || []).map((t) => t.x + ',' + t.y));
  return board.live.map((v, j) => (v ? j : -1)).filter((j) => j >= 0).find((j) => { const r = probe(board, j); return r.door != null && r.path.some(([x, y]) => tc.has(x + ',' + y)); }) ?? 0;
}
// Recorrido de una flecha (con sus giros), dibujado discontinuo hasta la puerta o hasta donde choca.
function showRoute(i) {
  hideRoute();
  if (!board.live[i]) return;
  const a = board.arrows[i], r = probe(board, i), ox = (vw() - board.w * S) / 2, oy = (vh() - board.h * S) / 2;
  const pts = [[a.x, a.y], ...r.path.slice(0, r.door == null ? r.steps : r.path.length).map(([x, y]) => [x, y])].map(([x, y]) => [ox + x * S + S / 2, oy + y * S + S / 2]);
  const lastDir = r.door != null ? r.edge : (r.path[r.steps]?.[2] || a.dir), [ex, ey] = DIRS[lastDir], end = pts[pts.length - 1];
  pts.push([end[0] + ex * (r.door != null ? S / 2 + 21 : 30), end[1] + ey * (r.door != null ? S / 2 + 21 : 30)]);
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.id = 'rprev'; g.setAttribute('pointer-events', 'none');
  const tip = pts[pts.length - 1], ok = r.door != null;
  g.innerHTML = `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="7" stroke-dasharray="4 14" stroke-linecap="round" stroke-linejoin="round" class="pline"/>
    ${ok ? `<circle cx="${tip[0]}" cy="${tip[1]}" r="11" fill="var(--ink)"/>` : `<path d="M${tip[0] - 12} ${tip[1] - 12}l24 24M${tip[0] + 12} ${tip[1] - 12}l-24 24" stroke="var(--alert)" stroke-width="7" stroke-linecap="round"/>`}`;
  fxLayer().appendChild(g);
  if (!reduced) g.animate([{ opacity: 0 }, { opacity: 1 }], 200);
}
function hideRoute() { const g = svg.querySelector('#rprev'); if (g) { if (reduced) g.remove(); else g.animate([{ opacity: 1 }, { opacity: 0 }], 160).finished.then(() => g.remove()).catch(() => g.remove()); } }
{ // mantener pulsada una flecha (≥ 0,35 s): enseña su recorrido y no la mueve
  let t = 0, shown = false;
  svg.addEventListener('pointerdown', (e) => { const g = e.target.closest('.arrow'); if (!g) return; shown = false; t = setTimeout(() => { shown = true; showRoute(+g.dataset.i); navigator.vibrate?.(8); }, 350); });
  const up = () => { clearTimeout(t); if (shown) { svg.swiped = true; hideRoute(); shown = false; } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up); svg.addEventListener('pointerleave', up);
}
{ // deslizar en 2D: hacia arriba bajas a la capa de abajo; hacia abajo vuelves
  let p0 = null; svg.swiped = false;
  svg.addEventListener('pointerdown', (e) => { p0 = { x: e.clientX, y: e.clientY }; svg.swiped = false; });
  svg.addEventListener('pointerup', (e) => {
    if (!p0) return;
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y; p0 = null;
    if (Math.abs(dy) < 50 || Math.abs(dy) < Math.abs(dx) * 1.5 || L.layers.length < 2) return;
    svg.swiped = true;
    setView(dy < 0 ? Math.min(view + 1, L.layers.length - 1) : Math.max(board.layer, view - 1));
  });
}
svg.addEventListener('click', (e) => { if (svg.swiped) { svg.swiped = false; return; } if (view > board.layer) return setView(board.layer); const g = e.target.closest('.arrow'); if (g && !$('ov').classList.contains('on')) tap(+g.dataset.i); });
svg.addEventListener('keydown', (e) => { const g = e.target.closest('.arrow'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tap(+g.dataset.i); } });
$('rewindBtn').onclick = rewind;
$('muteBtn').onclick = () => setMuted(!muted);
// Safari y Chrome no dejan sonar nada hasta el primer toque: en cuanto lo hay, arranca la música que toque
addEventListener('pointerdown', () => AC.resume(), { capture: true }); // iOS: el audio solo se desbloquea con un toque
addEventListener('pointerdown', () => { if (music && !muted && music.paused) { music.volume = 0; music.play().then(() => fadeVol(music, .28, 900)).catch(() => {}); } }, { once: true, capture: true });
setMuted(false);

// zonas seguras reales de cada aparato (pt): el 16e tiene muesca (no isla), arriba 47 y abajo 34

  card(`<svg class="hero" viewBox="0 0 180 150" aria-hidden="true">

      ${slab(52, '<rect x="-28" y="-30" width="20" height="44" rx="8" fill="var(--i-red)"/><rect x="6" y="-4" width="20" height="20" rx="7" fill="var(--i-blue)"/>')}
    </svg>
    <h1 class="title">Paint Out</h1>
    <p>${tr('4 niveles · 14 pruebas. Saca cada flecha por la puerta de su color.', '4 levels · 14 stages. Get each arrow out through the door of its color.')}</p>${fsTip()}
    <div class="row" style="flex-direction:column;align-items:center"><button class="btn primary big" id="play">${tx('Jugar')}</button>
    <button class="btn big" id="inf">∞ ${tx('Modo infinito')}${best ? tr(` · récord ${best}`, ` · record ${best}`) : ''}</button>
    <button class="btn ghostbtn" id="op">${tx('Danos tu opinión')}</button></div>
    <div class="row lang" role="radiogroup" aria-label="Language / Idioma">${[['en', 'English'], ['es', 'Español']].map(([l, n]) => `<button class="btn${l === LANG ? ' primary' : ''}" role="radio" aria-checked="${l === LANG}" data-lang="${l}">${n}</button>`).join('')}</div>`);
  $('card').querySelectorAll('[data-lang]').forEach((b) => (b.onclick = () => { if (b.dataset.lang !== LANG) I18N.set(b.dataset.lang); }));

[['menuBtn', 'Niveles'], ['muteBtn', 'Silenciar'], ['rewindBtn', 'Rebobinar capa'], ['layers', 'Capas'], ['board', 'Tablero'], ['v3d', 'Todas las capas en 3D']]
  .forEach(([id, es]) => $(id).setAttribute('aria-label', tx(es)));
if (new URLSearchParams(location.search).get('modo') === 'infinito') startEndless();
else if (q) load(Math.max(0, Math.min(NIVELES.length - 1, +q - 1)));
else home(); // siempre desde la portada
